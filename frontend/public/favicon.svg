<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="page-grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="page-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="32" r="16" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />

  <!-- Outer Layered Pages -->
  <path d="M14 22L20 18V45L14 42Z" fill="none" stroke="#0891b2" stroke-width="2" stroke-linejoin="round" opacity="0.6" />
  <path d="M50 22L44 18V45L50 42Z" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linejoin="round" opacity="0.6" />

  <!-- Inner Open Pages Frame -->
  <path d="M22 17L32 23V48L22 43Z" fill="none" stroke="url(#page-grad-left)" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M42 17L32 23V48L42 43Z" fill="none" stroke="url(#page-grad-right)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Bottom Page Spine / Convergence Base -->
  <path d="M14 42L32 50L50 42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Neural Intelligence Core Spark & Radiating Nodes -->
  <g filter="url(#glow)">
    <!-- Central Node -->
    <circle cx="32" cy="32" r="3.5" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Central Spine Beam -->
    <path d="M32 23V48" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <!-- Radiating Synaptic Beams & Nodes -->
    <line x1="32" y1="32" x2="25" y2="28" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="25" cy="28" r="1.8" fill="#a5f3fc" />

    <line x1="32" y1="32" x2="39" y2="28" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="39" cy="28" r="1.8" fill="#c7d2fe" />

    <line x1="32" y1="32" x2="24" y2="36" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="24" cy="36" r="1.8" fill="#a5f3fc" />

    <line x1="32" y1="32" x2="40" y2="36" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="40" cy="36" r="1.8" fill="#c7d2fe" />
  </g>
</svg>